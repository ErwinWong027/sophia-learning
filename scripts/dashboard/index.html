<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sophia 脚本管理台</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --dim:#94a3b8; --blue:#3b82f6; --green:#22c55e; --red:#ef4444; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,sans-serif; padding:20px; }
  h1 { font-size:22px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  label { font-size:13px; color:var(--dim); display:block; margin-bottom:4px; }
  input, select { background:#0f172a; border:1px solid var(--border); border-radius:8px; color:var(--text); padding:8px 12px; font-size:14px; }
  input { width:260px; }
  select { width:100px; }
  button { border:none; border-radius:8px; padding:10px 20px; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .15s; }
  button:hover { opacity:.85; }
  .btn-start { background:var(--green); color:#fff; }
  .btn-browser { background:#06b6d4; color:#fff; }
  .btn-automation { background:var(--green); color:#fff; }
  .btn-pause { background:#f59e0b; color:#fff; }
  .btn-resume { background:#3b82f6; color:#fff; }
  .btn-stop { background:var(--red); color:#fff; }
  .btn-kill { background:#b91c1c; color:#fff; }
  .btn-stop:disabled { opacity:.4; cursor:not-allowed; }
  .btn-kill:disabled { opacity:.4; cursor:not-allowed; }
  .btn-start:disabled { opacity:.4; cursor:not-allowed; }
  .btn-browser:disabled { opacity:.4; cursor:not-allowed; }
  .btn-automation:disabled { opacity:.4; cursor:not-allowed; }
  .btn-pause:disabled { opacity:.4; cursor:not-allowed; }
  .btn-resume:disabled { opacity:.4; cursor:not-allowed; }
  .btn-extract { background:#8b5cf6; color:#fff; }
  .btn-extract:disabled { opacity:.4; cursor:not-allowed; }
  .status-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .status-running { background:var(--green); box-shadow:0 0 8px var(--green); }
  .status-keepalive { background:#f59e0b; box-shadow:0 0 8px #f59e0b; }
  .status-stopped { background:var(--red); }
  #logs { background:#0d1117; border:1px solid var(--border); border-radius:8px; font-family:ui-monospace,'SF Mono',monospace; font-size:12px; line-height:1.6; height:420px; overflow-y:auto; padding:12px; white-space:pre-wrap; word-break:break-all; }
  .log-line { margin:0; }
  .pm-list { font-size:13px; color:var(--dim); }
  .pm-list span { background:#334155; padding:2px 8px; border-radius:4px; margin:2px; display:inline-block; color:var(--text); }
  .report-list { font-size:13px; }
  .report-item { background:#334155; padding:10px 14px; border-radius:8px; margin:6px 0; cursor:pointer; display:flex; justify-content:space-between; align-items:center; transition:background .15s; border-left:3px solid #3b82f6; }
  .report-item:hover { background:#475569; }
  .report-item.new { border-left-color:#22c55e; animation:fadeIn .5s; }
  .report-item.kind-json { border-left-color:#f59e0b; }
  .report-item.kind-image { border-left-color:#8b5cf6; }
  .report-item.kind-md { border-left-color:#3b82f6; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .report-name { font-weight:600; color:var(--text); }
  .report-meta { color:var(--dim); font-size:12px; display:flex; align-items:center; gap:8px; }
  .report-badge { background:var(--green); color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; margin-left:8px; }
  .report-kind { font-size:10px; padding:2px 6px; border-radius:4px; font-weight:600; text-transform:uppercase; }
  .kind-tag-md { background:#3b82f6; color:#fff; }
  .kind-tag-json { background:#f59e0b; color:#fff; }
  .kind-tag-image { background:#8b5cf6; color:#fff; }
  .report-actions { display:flex; gap:6px; }
  .btn-sm { border:none; border-radius:6px; padding:4px 10px; font-size:11px; font-weight:600; cursor:pointer; }
  .btn-view { background:#3b82f6; color:#fff; }
  .btn-del { background:#ef4444; color:#fff; }
  .btn-sm:hover { opacity:.85; }
  .report-filter { display:flex; gap:8px; align-items:center; }
  .filter-btn { background:#334155; color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; font-weight:600; }
  .filter-btn.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
  .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .modal-content { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px; max-width:90vw; max-height:85vh; overflow-y:auto; min-width:600px; }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .modal-close { background:none; border:none; color:var(--dim); font-size:24px; cursor:pointer; padding:0 8px; }
  .modal-close:hover { color:var(--text); }
  .modal-body { font-family:ui-monospace,'SF Mono',monospace; font-size:13px; line-height:1.6; white-space:pre-wrap; word-break:break-all; color:var(--text); }
  .modal-body img { max-width:100%; border-radius:8px; }
</style>
</head>
<body>
<h1>🎯 Sophia 脚本管理台</h1>

<div class="card">
  <div class="row" style="margin-bottom:12px;">
    <span class="status-dot status-stopped" id="dot"></span>
    <strong id="status-text">已停止</strong>
    <span id="pid-text" style="color:var(--dim);font-size:13px;"></span>
  </div>
  <div class="row" style="gap:16px;">
    <div>
      <label>课程 URL</label>
      <input id="url" value="https://app.sophia.org/spcc/introduction-to-relational-databases-2">
    </div>
    <div>
      <label>模式</label>
      <select id="mode">
        <option value="llm" selected>LLM 自动</option>
        <option value="ide">IDE 手动</option>
      </select>
    </div>
    <div>
      <label>跳过 (逗号分隔)</label>
      <input id="skip" placeholder="practice-milestone-1-1" style="width:200px;">
    </div>
  </div>
  <div class="row" style="margin-top:12px;">
    <button class="btn-browser" id="btn-browser" onclick="doOpenBrowser()">🌐 打开浏览器</button>
    <button class="btn-automation" id="btn-automation" onclick="doStartAutomation()" disabled>▶ 启动自动化</button>
    <button class="btn-extract" id="btn-extract" onclick="doExtractOnly()" disabled>📝 提取题目</button>
    <input id="manual-answers" placeholder="答案序列 如 abcd" style="width:130px;" />
    <button class="btn-automation" id="btn-manual" onclick="doManualAnswers()" disabled>🎯 按答案执行</button>
    <button class="btn-pause" id="btn-pause" onclick="doPause()" disabled>⏸ 暂停</button>
    <button class="btn-resume" id="btn-resume" onclick="doResume()" disabled>▶ 恢复</button>
    <button class="btn-stop" id="btn-stop" onclick="doStop()" disabled>■ 停止</button>
    <button class="btn-kill" id="btn-kill" onclick="doKill()" disabled>✖ 强制关闭</button>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between; margin-bottom:8px;">
    <strong>实时日志</strong>
    <label style="display:flex;align-items:center;gap:4px;">
      <input type="checkbox" id="autoscroll" checked style="width:auto;"> 自动滚动
    </label>
  </div>
  <div id="logs"></div>
</div>

<div class="card">
  <strong style="font-size:14px;">已完成的 Practice Milestones</strong>
  <div class="pm-list" id="pm-list" style="margin-top:8px;">加载中...</div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between; margin-bottom:8px;">
    <strong style="font-size:14px;">📁 报告与输出</strong>
    <div class="report-filter">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
      <button class="filter-btn" data-filter="md" onclick="setFilter('md')">MD</button>
      <button class="filter-btn" data-filter="json" onclick="setFilter('json')">JSON</button>
      <button class="filter-btn" data-filter="image" onclick="setFilter('image')">截图</button>
      <button class="btn-browser" onclick="loadReports()" style="padding:6px 12px; font-size:12px;">🔄 刷新</button>
      <button class="btn-kill" onclick="clearAllReports()" style="padding:6px 12px; font-size:12px;">🗑 清空</button>
    </div>
  </div>
  <div class="report-list" id="report-list">加载中...</div>
</div>

<!-- 报告查看模态框 -->
<div id="report-modal" class="modal-overlay" style="display:none;" onclick="closeReportModal(event)">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <strong id="modal-title">报告</strong>
      <button class="modal-close" onclick="closeReportModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
let polling = null;

async function doOpenBrowser() {
  const body = {
    url: document.getElementById('url').value,
    mode: document.getElementById('mode').value,
    skip: document.getElementById('skip').value,
    max_rounds: 999,
    max_challenges: 999,
    browser_only: true,
  };
  const res = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if (!data.ok) alert('启动失败: ' + (data.error || '未知错误'));
}

async function doStartAutomation() {
  await fetch('/api/automation', {method:'POST'});
}

async function doManualAnswers() {
  const raw = document.getElementById('manual-answers').value || '';
  const seq = raw.toLowerCase().replace(/[^a-d]/g, '');
  if (!seq) { alert('请输入 a-d 的答案序列，如 abcd（第1题选a、第2题选b…）'); return; }
  const status = await fetch('/api/status').then(r => r.json()).catch(() => ({}));
  if (!status.running) { alert('请先打开浏览器并导航到题目页'); return; }
  const res = await fetch('/api/manual', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({answers: seq})});
  const data = await res.json();
  if (!data.ok) alert('启动失败: ' + (data.error || '未知错误'));
}

async function doExtractOnly() {
  // 如果脚本已在运行（浏览器就绪状态），发送 extract 信号恢复
  const status = await fetch('/api/status').then(r => r.json()).catch(() => ({}));
  if (status.running) {
    const res = await fetch('/api/extract', {method:'POST'});
    const data = await res.json();
    if (!data.ok) alert('启动失败: ' + (data.error || '未知错误'));
    return;
  }
  // 否则启动新的 extract-only 进程
  const body = {
    url: document.getElementById('url').value,
    mode: 'llm',
    skip: document.getElementById('skip').value,
    max_rounds: 999,
    max_challenges: 999,
    extract_only: true,
  };
  const res = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const data = await res.json();
  if (!data.ok) alert('启动失败: ' + (data.error || '未知错误'));
}

async function doStop() {
  if (!confirm('确定停止脚本？浏览器会关闭。')) return;
  await fetch('/api/stop', {method:'POST'});
}

async function doKill() {
  if (!confirm('强制关闭会杀掉进程并关闭浏览器，确定？')) return;
  await fetch('/api/kill', {method:'POST'});
}

async function doPause() {
  await fetch('/api/pause', {method:'POST'});
}

async function doResume() {
  await fetch('/api/resume', {method:'POST'});
}

let knownReports = [];
let currentFilter = 'all';
let allReportsData = [];

function setFilter(kind) {
  currentFilter = kind;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === kind);
  });
  renderReports();
}

function renderReports() {
  const el = document.getElementById('report-list');
  const filtered = currentFilter === 'all' ? allReportsData : allReportsData.filter(r => r.kind === currentFilter);
  if (filtered.length === 0) {
    el.innerHTML = '<div style="color:var(--dim); padding:8px;">' + (allReportsData.length === 0 ? '暂无报告' : '当前分类无文件') + '</div>';
    return;
  }
  const kindTag = (kind) => {
    const labels = {md:'MD', json:'JSON', image:'IMG'};
    return '<span class="report-kind kind-tag-' + kind + '">' + (labels[kind]||kind) + '</span>';
  };
  el.innerHTML = filtered.map(r => {
    const isNew = !knownReports.includes(r.name);
    return `
    <div class="report-item kind-${r.kind}${isNew ? ' new' : ''}" onclick="viewReport('${r.name}')">
      <span class="report-name">${r.name}${isNew ? '<span class="report-badge">NEW</span>' : ''}</span>
      <span class="report-meta">
        ${kindTag(r.kind)}
        <span>${r.modified} · ${(r.size/1024).toFixed(1)}KB</span>
        <span class="report-actions">
          <button class="btn-sm btn-del" onclick="event.stopPropagation(); deleteReport('${r.name}')">删除</button>
        </span>
      </span>
    </div>`;
  }).join('');
}

async function loadReports() {
  try {
    const res = await fetch('/api/reports');
    const data = await res.json();
    allReportsData = data.reports || [];
    const newNames = new Set(allReportsData.map(r => r.name));
    const added = allReportsData.filter(r => !knownReports.includes(r.name)).map(r => r.name);
    knownReports = [...newNames];
    renderReports();
  } catch(e) {
    document.getElementById('report-list').innerHTML = '<div style="color:var(--red);">加载失败</div>';
  }
}

async function viewReport(name) {
  try {
    const res = await fetch('/api/report/' + encodeURIComponent(name));
    const data = await res.json();
    if (data.error) {
      alert('加载失败: ' + data.error);
      return;
    }
    document.getElementById('modal-title').textContent = data.name;
    const bodyEl = document.getElementById('modal-body');
    if (data.kind === 'image') {
      bodyEl.innerHTML = '<img src="file://' + data.path + '" alt="' + data.name + '">';
    } else if (data.kind === 'json') {
      try {
        const parsed = JSON.parse(data.content);
        bodyEl.textContent = JSON.stringify(parsed, null, 2);
      } catch {
        bodyEl.textContent = data.content;
      }
    } else {
      bodyEl.textContent = data.content;
    }
    document.getElementById('report-modal').style.display = 'flex';
  } catch(e) {
    alert('加载失败: ' + e.message);
  }
}

async function deleteReport(name) {
  if (!confirm('确定删除 ' + name + '？')) return;
  try {
    const res = await fetch('/api/reports/delete', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name})
    });
    const data = await res.json();
    if (!data.ok) { alert('删除失败: ' + (data.error || '')); return; }
    knownReports = knownReports.filter(n => n !== name);
    allReportsData = allReportsData.filter(r => r.name !== name);
    renderReports();
  } catch(e) {
    alert('删除失败: ' + e.message);
  }
}

async function clearAllReports() {
  if (!confirm('确定清空所有报告和输出文件？（保留 flag 和 stdout log）')) return;
  try {
    const res = await fetch('/api/reports/clear', {method: 'POST'});
    const data = await res.json();
    if (!data.ok) { alert('清空失败: ' + (data.error || '')); return; }
    knownReports = [];
    allReportsData = [];
    renderReports();
  } catch(e) {
    alert('清空失败: ' + e.message);
  }
}

function closeReportModal(event) {
  if (!event || event.target.id === 'report-modal') {
    document.getElementById('report-modal').style.display = 'none';
  }
}

async function poll() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    const dot = document.getElementById('dot');
    const stxt = document.getElementById('status-text');
    const ptxt = document.getElementById('pid-text');
    const btnB = document.getElementById('btn-browser');
    const btnA = document.getElementById('btn-automation');
    const btnE = document.getElementById('btn-extract');
    const btnM = document.getElementById('btn-manual');
    const btnP = document.getElementById('btn-pause');
    const btnR = document.getElementById('btn-resume');
    const btnX = document.getElementById('btn-stop');
    const btnK = document.getElementById('btn-kill');

    // 检查日志中是否有 BROWSER_READY 标记
    const browserReady = data.logs && data.logs.some(l => l.includes('BROWSER_READY'));
    const allLoopsDone = data.logs && data.logs.some(l => l.includes('ALL_LOOPS_DONE'));

    if (data.running && data.paused) {
      if (browserReady && !allLoopsDone) {
        // 浏览器已打开，用户可自由选择模式
        dot.className = 'status-dot status-keepalive';
        stxt.textContent = '浏览器就绪 - 请手动导航后选择模式';
        ptxt.textContent = 'PID: ' + data.pid;
        btnB.disabled = true;
        btnA.disabled = false;
        btnE.disabled = false;
        btnM.disabled = false;
        btnP.disabled = true;
        btnR.disabled = true;
        btnX.disabled = false;
        btnK.disabled = false;
      } else {
        // 手动暂停状态 — 可自由切换模式
        dot.className = 'status-dot status-keepalive';
        stxt.textContent = '已暂停 - 选择「启动自动化」、「提取题目」或「按答案执行」切换模式';
        ptxt.textContent = 'PID: ' + data.pid;
        btnB.disabled = true;
        btnA.disabled = false;
        btnE.disabled = false;
        btnM.disabled = false;
        btnP.disabled = true;
        btnR.disabled = false;
        btnX.disabled = false;
        btnK.disabled = false;
      }
    } else if (data.running) {
      dot.className = 'status-dot status-running';
      stxt.textContent = data.external ? '运行中（外部进程）' : '自动化运行中';
      ptxt.textContent = 'PID: ' + data.pid;
      btnB.disabled = true;
      btnA.disabled = true;
      btnE.disabled = true;
      btnM.disabled = true;
      btnP.disabled = false;
      btnR.disabled = true;
      btnX.disabled = false;
      btnK.disabled = false;
    } else {
      dot.className = 'status-dot status-stopped';
      stxt.textContent = '已停止';
      ptxt.textContent = '';
      btnB.disabled = false;
      btnA.disabled = true;
      btnE.disabled = false;
      btnM.disabled = true;
      btnP.disabled = true;
      btnR.disabled = true;
      btnX.disabled = true;
      btnK.disabled = true;
    }

    const logsEl = document.getElementById('logs');
    logsEl.innerHTML = data.logs.map(l => {
      const escaped = l.replace(/</g,'&lt;');
      if (l.includes('REPORT_GENERATED') || l.includes('EXTRACT_REPORT_GENERATED')) {
        return '<p class="log-line" style="color:#22c55e;font-weight:600;background:#1a2e1a;padding:2px 6px;border-radius:4px;">📄 ' + escaped + '</p>';
      }
      if (l.includes('EXTRACT_ONLY_WARNING')) {
        return '<p class="log-line" style="color:#ef4444;font-weight:600;background:#2e1a1a;padding:2px 6px;border-radius:4px;">⚠️ ' + escaped + '</p>';
      }
      if (l.includes('EXTRACT_ONLY') || l.includes('EXTRACTED')) {
        return '<p class="log-line" style="color:#8b5cf6;font-weight:600;">📝 ' + escaped + '</p>';
      }
      if (l.includes('MANUAL_DONE')) {
        return '<p class="log-line" style="color:#22c55e;font-weight:600;background:#1a2e1a;padding:2px 6px;border-radius:4px;">🎯 ' + escaped + '</p>';
      }
      if (l.includes('MANUAL_MODE') || l.includes('MANUAL_WARN')) {
        return '<p class="log-line" style="color:#f59e0b;font-weight:600;">🎯 ' + escaped + '</p>';
      }
      return '<p class="log-line">' + escaped + '</p>';
    }).join('');
    if (document.getElementById('autoscroll').checked) {
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    const pmEl = document.getElementById('pm-list');
    if (data.done_practice_milestones && data.done_practice_milestones.length > 0) {
      pmEl.innerHTML = data.done_practice_milestones.map(id => '<span>' + id + '</span>').join('');
    } else {
      pmEl.textContent = '暂无';
    }
  } catch(e) {}
}

polling = setInterval(() => { poll(); loadReports(); }, 2000);
poll();
loadReports();
</script>
</body>
</html>
